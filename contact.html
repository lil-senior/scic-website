<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Stephenson Cardiac Imaging Centre</title>
  <link rel="icon" type="image/png" href="images/SCIC_Favicon.png">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <style>
    #map {
      height: 500px;
      border-radius: 10px;
      margin-top: 2rem;
    }
    @media (max-width: 768px) {
      .contact-layout {
        flex-direction: column !important;
      }
      #map {
        height: 300px;
        margin-top: 1rem;
      }
    }
  </style>
</head>
<body>

<div id="nav-holder"></div>

<section class="page-hero">
  <div class="page-hero-bg"></div>
  <div class="container">
    <span class="eyebrow">Contact</span>
  </div>
</section>

<!-- ====== CONTACT INFO ====== -->
<section class="section">
  <div class="container">
    <div class="fade-in">
      <h2>Find us</h2>

      <div class="contact-layout" style="display:flex;gap:3rem;margin-top:2rem;align-items:flex-start;">
        <div style="flex:1;">
          <div style="display:flex;flex-direction:column;gap:1.5rem;max-width:600px;">

        <div style="display:flex;gap:1.25rem;align-items:flex-start;">
          <div style="width:48px;height:48px;border-radius:10px;background:rgba(0,171,255,0.1);display:flex;align-items:center;justify-content:center;color:var(--blue);font-size:1.25rem;flex-shrink:0;">📍</div>
          <div>
            <strong style="display:block;margin-bottom:0.25rem;">Location</strong>
            <p style="margin:0;font-size:0.95rem;">Stephenson Cardiac Imaging Centre<br>Special Service Building<br>Foothills Medical Centre<br>1403 29 Street NW<br>Calgary, Alberta T2N 2T9</p>
          </div>
        </div>

        <div style="display:flex;gap:1.25rem;align-items:flex-start;">
          <div style="width:48px;height:48px;border-radius:10px;background:rgba(0,171,255,0.1);display:flex;align-items:center;justify-content:center;color:var(--blue);font-size:1.25rem;flex-shrink:0;">✉️</div>
          <div>
            <strong style="display:block;margin-bottom:0.25rem;">Email</strong>
            <p style="margin:0;font-size:0.95rem;">
              <a href="mailto:stephensoncentre@ucalgary.ca" style="color:var(--blue);">stephensoncentre@ucalgary.ca</a>
            </p>
          </div>
        </div>

        <div style="display:flex;gap:1.25rem;align-items:flex-start;">
          <div style="width:48px;height:48px;border-radius:10px;background:rgba(0,171,255,0.1);display:flex;align-items:center;justify-content:center;color:var(--blue);font-size:1.25rem;flex-shrink:0;">🕐</div>
          <div>
            <strong style="display:block;margin-bottom:0.25rem;">Hours</strong>
            <p style="margin:0;font-size:0.95rem;">
              Monday - Friday: 7:30 AM - 5:30 PM<br>
            </p>
          </div>
        </div>

          </div>
        </div>

        <div style="flex:1;">
          <div id="map"></div>
        </div>
      </div>
    </div>
  </div>
</section>

<div id="footer-holder"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
  const map = L.map('map').setView([51.063383, -114.133733], 15);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors',
    maxZoom: 19
  }).addTo(map);
  L.marker([51.063383, -114.133733]).addTo(map)
    .bindPopup('Stephenson Cardiac Imaging Centre<br>Foothills Medical Centre');
</script>
<script src="js/nav.js"></script>
<script src="js/main.js"></script>
<script data-goatcounter="https://scic-website.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</body>
</html>
