<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>News & Updates | Stephenson Cardiac Imaging Centre</title>
  <link rel="icon" type="image/png" href="images/SCIC_Favicon.png">
  <link rel="stylesheet" href="css/main.css">
  <style>
    .news-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
      gap: 2rem;
      margin-top: 2rem;
    }
    @media (max-width: 768px) {
      .news-grid {
        grid-template-columns: 1fr;
        gap: 1.5rem;
      }
    }
    @media (max-width: 480px) {
      .news-grid {
        gap: 1rem;
        justify-items: center;
      }
      .news-card {
        max-width: 100%;
      }
    }
    .news-card {
      border: 1px solid rgba(0, 171, 255, 0.2);
      border-radius: 12px;
      overflow: hidden;
      background: rgba(0, 171, 255, 0.03);
      transition: transform 0.3s, box-shadow 0.3s;
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    .news-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(0, 171, 255, 0.15);
      border-color: rgba(0, 171, 255, 0.4);
    }
    .news-card-image {
      width: 100%;
      height: 200px;
      object-fit: cover;
      display: block;
    }
    .archive-item-image {
      width: 100px;
      height: 80px;
      object-fit: cover;
      border-radius: 6px;
      flex-shrink: 0;
    }
    .news-card-header {
      padding: 2rem 2rem 1rem;
      border-bottom: 2px solid var(--blue);
    }
    .news-card-date {
      font-size: 0.85rem;
      color: var(--blue);
      font-weight: 600;
      margin-bottom: 0.5rem;
    }
    .news-card-title {
      margin: 0;
      font-size: 1.25rem;
      color: #000;
    }
    .news-card-body {
      padding: 0 2rem 2rem;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
    }
    .news-card-body p {
      margin-top: 0;
      color: #555;
      line-height: 1.6;
      flex-grow: 1;
    }
    @media (prefers-color-scheme: dark) {
      .news-card-body p {
        color: #272727;
      }
    }
    .news-card-link {
      display: inline-block;
      color: var(--blue);
      font-weight: 600;
      margin-top: 1rem;
      text-decoration: none;
    }
    .news-card-link:hover {
      text-decoration: underline;
    }
    .section-title {
      font-size: 1.75rem;
      margin-top: 3rem;
      margin-bottom: 1rem;
      padding-bottom: 1rem;
      border-bottom: 2px solid rgba(0, 171, 255, 0.2);
    }
    .archive-grid {
      display: grid;
      gap: 1rem;
      margin-top: 1.5rem;
    }
    .archive-item {
      display: flex;
      gap: 1.5rem;
      padding: 1.5rem;
      border-left: 4px solid var(--blue);
      background: rgba(0, 171, 255, 0.05);
      border-radius: 8px;
      align-items: flex-start;
      transition: background 0.2s;
    }
    .archive-item:hover {
      background: rgba(0, 171, 255, 0.1);
    }
    .archive-date {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--blue);
      flex-shrink: 0;
      min-width: 100px;
    }
    .archive-content {
      flex-grow: 1;
    }
    .archive-content h4 {
      margin: 0 0 0.25rem 0;
      font-size: 1rem;
      color: #000;
    }
    .archive-content p {
      margin: 0;
      font-size: 0.9rem;
      color: #555;
    }
    @media (prefers-color-scheme: dark) {
      .archive-content p {
        color: #e0e0e0;
      }
    }
    .empty-state {
      text-align: center;
      padding: 2rem;
      color: #666;
    }
    @media (prefers-color-scheme: dark) {
      .empty-state {
        color: #aaa;
      }
    }
  </style>
</head>
<body>

<div id="nav-holder"></div>

<section class="page-hero">
  <div class="page-hero-bg"></div>
  <div class="container">
    <span class="eyebrow">News & Updates</span>
  </div>
</section>

<!-- ====== NEWS SECTION ====== -->
<section class="section">
  <div class="container">
    <div class="fade-in">
      <h2>Latest News</h2>

      <!-- Featured Stories (max 6) -->
      <div id="featured-stories" class="news-grid">
        <div class="empty-state">Loading stories...</div>
      </div>

      <!-- Archive Section -->
      <h3 class="section-title">Archive</h3>
      <div id="archive-stories" class="archive-grid">
        <div class="empty-state">No archived stories</div>
      </div>
    </div>
  </div>
</section>

<div id="footer-holder"></div>
<script src="js/nav.js"></script>
<script src="js/main.js"></script>
<script>
  async function loadNews() {
    try {
      const response = await fetch('news.json');
      const data = await response.json();

      // Sort by date (newest first)
      const sorted = data.stories.sort((a, b) => new Date(b.date) - new Date(a.date));

      // Split: first 6 are featured, rest are archived
      const featured = sorted.slice(0, 6);
      const archived = sorted.slice(6);

      renderFeatured(featured);
      renderArchive(archived);
    } catch (error) {
      console.error('Error loading news:', error);
      document.getElementById('featured-stories').innerHTML =
        '<div class="empty-state">Unable to load stories</div>';
    }
  }

  function renderFeatured(stories) {
    const container = document.getElementById('featured-stories');

    if (stories.length === 0) {
      container.innerHTML = '<div class="empty-state">No stories yet</div>';
      return;
    }

    container.innerHTML = stories.map(story => `
      <div class="news-card">
        ${story.image ? `<img src="${story.image}" alt="${story.title}" class="news-card-image">` : ''}
        <div class="news-card-header">
          <div class="news-card-date">${formatDate(story.date)}</div>
          <h3 class="news-card-title">${story.title}</h3>
        </div>
        <div class="news-card-body">
          <p>${story.summary}</p>
          ${story.link ? `<a href="${story.link}" class="news-card-link">Read more →</a>` : ''}
        </div>
      </div>
    `).join('');
  }

  function renderArchive(stories) {
    const container = document.getElementById('archive-stories');

    if (stories.length === 0) {
      container.innerHTML = '<div class="empty-state">No archived stories</div>';
      return;
    }

    container.innerHTML = stories.map(story => `
      <div class="archive-item">
        ${story.image ? `<img src="${story.image}" alt="${story.title}" class="archive-item-image">` : ''}
        <div class="archive-date">${formatDate(story.date)}</div>
        <div class="archive-content">
          <h4>${story.title}</h4>
          <p>${story.summary}</p>
        </div>
        ${story.link ? `<a href="${story.link}" style="text-decoration: none; color: var(--blue);">→</a>` : ''}
      </div>
    `).join('');
  }

  function formatDate(dateStr) {
    const date = new Date(dateStr);
    return date.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
  }

  loadNews();
</script>
</body>
</html>
